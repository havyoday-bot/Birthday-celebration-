<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Birthday Celebration 🎂</title>
<style>
*{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent}
html,body{height:100%;overflow:hidden;font-family:'Segoe UI',system-ui,sans-serif;color:#fff;background:linear-gradient(160deg,#2b1055,#7597de 120%);touch-action:manipulation}
.scr{position:absolute;inset:0;display:none;flex-direction:column;align-items:center;justify-content:center;padding:20px;text-align:center;overflow:hidden}
.scr.on{display:flex;animation:fade .6s}
@keyframes fade{from{opacity:0}to{opacity:1}}
h1{font-family:Georgia,serif;font-size:clamp(28px,8vw,52px);text-shadow:0 4px 20px #0006;margin:10px 0}
.card{background:#ffffff1f;backdrop-filter:blur(10px);border:1px solid #fff4;border-radius:24px;padding:28px 22px;width:min(92%,380px);box-shadow:0 10px 40px #0005}
input{width:100%;padding:14px;margin:8px 0 14px;border-radius:12px;border:0;font-size:17px;outline:none}
label{display:block;text-align:left;font-size:14px;opacity:.9}
button.b{background:linear-gradient(135deg,#ff416c,#ff9a44);color:#fff;border:0;border-radius:50px;padding:14px 34px;font-size:18px;font-weight:700;cursor:pointer;box-shadow:0 6px 20px #0006;transition:.2s}
button.b:active{transform:scale(.94)}
.bg{position:fixed;inset:0;pointer-events:none;z-index:0;overflow:hidden}
.fb{position:absolute;bottom:-120px;width:50px;height:64px;border-radius:50% 50% 48% 48%;opacity:.85;animation:rise linear infinite}
.fb:after{content:"";position:absolute;left:50%;top:100%;width:1px;height:50px;background:#fff8}
@keyframes rise{to{transform:translateY(-120vh) rotate(15deg)}}
.scr>*{position:relative;z-index:1}
.age{font-size:clamp(20px,5vw,28px);margin:12px 0;line-height:1.6;min-height:90px}
.age b{font-size:1.5em;color:#ffd166}
/* floating photos */
.ph{position:fixed;width:110px;padding:6px 6px 22px;background:#fff;border-radius:6px;box-shadow:0 6px 18px #0007;z-index:2;animation:drift linear forwards;pointer-events:none}
.ph img,.ph div{width:100%;height:100px;object-fit:cover;display:block;background:#ffd166;font-size:50px;line-height:100px}
@keyframes drift{0%{transform:translateY(0) rotate(var(--r)) scale(.5);opacity:0}10%{opacity:1;transform:translateY(-10vh) rotate(var(--r)) scale(1)}90%{opacity:1}100%{transform:translateY(-125vh) rotate(calc(var(--r)*-1));opacity:0}}
/* balloons */
.balloons{display:flex;gap:18px;justify-content:center;margin:24px 0}
.bl{width:84px;height:106px;border-radius:50% 50% 48% 48%;position:relative;cursor:pointer;animation:float 3s ease-in-out infinite;box-shadow:inset -10px -10px 20px #0003,0 8px 20px #0004;display:flex;align-items:center;justify-content:center;font-size:30px;font-weight:700}
.bl:after{content:"";position:absolute;top:100%;left:50%;width:2px;height:60px;background:#fffa}
.bl:nth-child(2){animation-delay:.5s}.bl:nth-child(3){animation-delay:1s}
@keyframes float{50%{transform:translateY(-16px) rotate(3deg)}}
.pop{animation:boom .35s forwards;pointer-events:none}
@keyframes boom{50%{transform:scale(1.4)}100%{transform:scale(0);opacity:0}}
.msg{position:fixed;inset:0;z-index:50;background:#000a;display:none;align-items:center;justify-content:center;flex-direction:column;padding:20px;text-align:center}
.msg.on{display:flex;animation:fade .3s}
.msg h2{font-family:Georgia,serif;font-size:clamp(30px,9vw,54px);color:#ffd166;text-shadow:0 0 25px #ff9a44;animation:zoom .6s}
@keyframes zoom{from{transform:scale(0)}}
/* dancer */
.dancer{position:relative;width:140px;height:240px;margin:auto;animation:hop .5s ease-in-out infinite alternate}
.dancer *{position:absolute}
.hat{left:42px;top:-34px;width:0;height:0;border-left:28px solid transparent;border-right:28px solid transparent;border-bottom:50px solid #ff416c}
.hat:after{content:"";left:-8px;top:-10px;width:16px;height:16px;border-radius:50%;background:#ffd166}
.head{left:30px;top:0;width:80px;height:80px;background:#ffcf9f;border-radius:50%;font-size:34px;line-height:80px;text-align:center}
.body{left:35px;top:80px;width:70px;height:85px;background:linear-gradient(#4facfe,#00c6ff);border-radius:20px}
.arm{top:85px;width:14px;height:70px;background:#ffcf9f;border-radius:10px;transform-origin:top center}
.al{left:18px;animation:armL .4s ease-in-out infinite alternate}.ar{left:108px;animation:armR .4s ease-in-out infinite alternate}
.leg{top:162px;width:20px;height:70px;background:#3a3a8c;border-radius:10px;transform-origin:top center}
.ll{left:42px;animation:armR .5s ease-in-out infinite alternate}.lr{left:78px;animation:armL .5s ease-in-out infinite alternate}
@keyframes armL{from{transform:rotate(-150deg)}to{transform:rotate(-20deg)}}
@keyframes armR{from{transform:rotate(150deg)}to{transform:rotate(20deg)}}
@keyframes hop{from{transform:translateY(0) rotate(-6deg)}to{transform:translateY(-22px) rotate(6deg)}}
.tag{font-size:24px;font-weight:700;margin-top:18px;color:#ffd166}
/* cake */
.cakewrap{position:relative;width:240px;height:200px;margin-top:60px}
.cakehalf{position:absolute;top:0;width:50%;height:100%;overflow:hidden;transition:transform 1s}
.cakehalf.l{left:0}.cakehalf.r{left:50%}.cakehalf.r .cake{left:-100%}
.cakewrap.cut .l{transform:translateX(-26px) rotate(-5deg)}.cakewrap.cut .r{transform:translateX(26px) rotate(5deg)}
.cake{position:absolute;top:0;width:200%;height:100%}
.t3,.t2,.t1{position:absolute;left:50%;transform:translateX(-50%);border-radius:12px}
.t1{bottom:0;width:240px;height:70px;background:#ff8fab}.t2{bottom:70px;width:190px;height:60px;background:#ffc2d1}.t3{bottom:130px;width:140px;height:50px;background:#fff0f3}
.t1:before,.t2:before,.t3:before{content:"";position:absolute;top:0;left:0;right:0;height:14px;background:#fff;border-radius:12px 12px 20px 20px;opacity:.9}
.candles{position:absolute;top:-52px;left:0;width:100%;display:flex;justify-content:center;gap:16px;z-index:3}
.cd{width:10px;height:42px;background:repeating-linear-gradient(#ffd166 0 8px,#ff416c 8px 16px);border-radius:3px;position:relative}
.fl{position:absolute;left:-3px;top:-24px;width:16px;height:24px;background:radial-gradient(#fff,#ffd166 40%,#ff7b00);border-radius:50% 50% 50% 50%/65% 65% 35% 35%;animation:flick .15s infinite alternate;box-shadow:0 0 18px #ffb703}
@keyframes flick{to{transform:scale(1.1,.9) rotate(4deg)}}
.cd.off .fl{animation:none;opacity:0;transition:.3s}
.cd.off:after{content:"";position:absolute;left:3px;top:-40px;width:4px;height:30px;background:#fff6;border-radius:4px;animation:smoke 1.5s forwards}
@keyframes smoke{to{transform:translateY(-40px);opacity:0}}
.wind{position:fixed;left:-300px;height:4px;width:200px;background:linear-gradient(90deg,transparent,#fff);border-radius:4px;z-index:5;animation:blow 1.1s linear forwards}
@keyframes blow{to{left:110vw}}
.knife{position:fixed;font-size:64px;z-index:20;touch-action:none;cursor:grab;transform:rotate(-30deg);filter:drop-shadow(0 4px 6px #0008);animation:pulse 1s infinite alternate}
@keyframes pulse{to{scale:1.12}}
.hint{font-size:22px;margin-top:30px;min-height:60px;text-shadow:0 2px 10px #000a}
#conf{position:fixed;inset:0;pointer-events:none;z-index:60}
.vol{position:fixed;top:12px;right:12px;z-index:80;background:#0006;border:0;color:#fff;font-size:22px;width:44px;height:44px;border-radius:50%}

/* ===== PREMIUM THEME ===== */
html,body{background:radial-gradient(circle at 20% 0%,#4b1d6e,#170b33 55%,#06030f)!important}
h1{background:linear-gradient(100deg,#fff2b0,#f6c453,#fff6d5,#e8a317,#fff2b0);background-size:250% 100%;-webkit-background-clip:text;background-clip:text;color:transparent;text-shadow:none;filter:drop-shadow(0 3px 14px #f6c45366);animation:shim 5s linear infinite}
@keyframes shim{to{background-position:250% 0}}
.card{background:linear-gradient(145deg,#ffffff22,#ffffff0a);border:1px solid #f6c45388;box-shadow:0 20px 60px #000a,inset 0 0 30px #f6c45318}
input{background:#ffffffee;color:#2a1740;font-weight:600;box-shadow:0 0 0 2px #f6c45300;transition:.2s}
input:focus{box-shadow:0 0 0 3px #f6c453}
label{color:#f6d98a;letter-spacing:.5px}
button.b{position:relative;overflow:hidden;background:linear-gradient(135deg,#f9d976,#f39f86 55%,#e8a317);color:#3a1f00;text-shadow:0 1px 0 #fff6;box-shadow:0 8px 26px #f6a31766,inset 0 1px 0 #fff8}
button.b:after{content:"";position:absolute;top:0;left:-80%;width:50%;height:100%;background:linear-gradient(90deg,transparent,#fff9,transparent);transform:skewX(-20deg);animation:swp 2.8s infinite}
@keyframes swp{to{left:140%}}
.st{position:fixed;width:3px;height:3px;border-radius:50%;background:#fff;animation:tw 3s infinite alternate;pointer-events:none;z-index:0}
@keyframes tw{from{opacity:.1}to{opacity:1;box-shadow:0 0 8px #fff}}
.sp{position:fixed;pointer-events:none;z-index:90;color:#ffd166;font-size:16px;animation:spk .8s forwards}
@keyframes spk{to{transform:translateY(24px) scale(0) rotate(180deg);opacity:0}}
.sub{color:#f6d98a;letter-spacing:3px;font-size:13px;text-transform:uppercase;margin-bottom:6px}
/* gift */
.gift{font-size:120px;cursor:pointer;animation:shake 1s infinite;filter:drop-shadow(0 0 30px #f6c453)}
@keyframes shake{0%,100%{transform:rotate(0)}20%{transform:rotate(-8deg) scale(1.05)}40%{transform:rotate(8deg)}60%{transform:rotate(-5deg)}}
.reveal{display:none;animation:zoom .7s}
.coupon{border:2px dashed #f6c453;border-radius:20px;padding:22px;margin:16px 0;background:#ffffff14;font-size:20px;line-height:1.6}
.coupon b{color:#ffd166;font-size:1.3em;display:block}
/* special message */
.ring{width:170px;height:170px;border-radius:50%;padding:5px;background:conic-gradient(#f9d976,#e8a317,#fff6d5,#e8a317,#f9d976);animation:spin 8s linear infinite;box-shadow:0 0 40px #f6c45399}
.ring>div{width:100%;height:100%;border-radius:50%;background-size:cover;background-position:center top;border:4px solid #170b33;animation:spin 8s linear infinite reverse}
@keyframes spin{to{transform:rotate(360deg)}}
.lines{margin:20px 0 14px;min-height:170px;font-size:clamp(17px,4.6vw,22px);line-height:1.7}
.lines div{animation:fade 1s;margin:6px 0}
.lines div:first-child{color:#ffd166;font-family:Georgia,serif;font-size:1.3em}
/* certificate */
.cert{border:2px solid #f6c453;border-radius:16px;padding:12px 16px;margin:14px 0 0;background:#ffffff14;font-size:15px;line-height:1.5;box-shadow:0 0 30px #f6c45344;max-width:340px}
.cert b{color:#ffd166;font-family:Georgia,serif;font-size:1.2em}
.hat,.al,.ar{}

/* ===== SMOOTH / PERFORMANCE ===== */
.card{backdrop-filter:none;-webkit-backdrop-filter:none;background:#2a1650cc}
h1{animation:none;filter:none}
button.b:after{display:none}
@keyframes tw{from{opacity:.15}to{opacity:1}}
.gift{filter:none;text-shadow:0 0 30px #f6c453}
.ring,.ring>div{animation:none}
@keyframes blow{from{transform:translateX(0)}to{transform:translateX(130vw)}}
.fb{will-change:transform}.fb:after{display:none}
@keyframes rise{to{transform:translate3d(0,-120vh,0)}}
.ph,.dancer,.bl{will-change:transform}
.msg{background:#000c}
</style>
</head>
<body>
<div class="bg" id="bg"></div>
<canvas id="conf"></canvas>
<button class="vol" id="vol" style="display:none">🔊</button>

<!-- 1. FORM -->
<section class="scr on" id="s1">
  <div style="font-size:64px">🎈🎂🎈</div>
  <div class="sub">✦ A celebration made only for you ✦</div>
  <h1>Birthday Celebration</h1>
  <div class="card" id="f">
    <label>Your Name</label><input id="nm" required placeholder="e.g. Rahul Sharma" maxlength="40">
    <label>Date of Birth</label><input id="dob" type="date" required>
    <button class="b" type="button" id="save">Save ✨</button>
  </div>
</section>

<!-- 2. GREETING -->
<section class="scr" id="s2">
  <div style="font-size:60px">🎉</div>
  <h1 id="greet"></h1>
  <div class="age" id="age"></div>
  <button class="b" id="go" style="display:none">Let's Celebrate 🎊</button>
</section>

<!-- 3. BALLOONS -->
<section class="scr" id="s3">
  <h1>Pop the Balloons! 🎈</h1>
  <p id="cnt">Tap a balloon to see what's inside</p>
  <div class="balloons">
    <div class="bl" data-i="0" style="background:radial-gradient(circle at 30% 30%,#ff8fab,#e5383b)">?</div>
    <div class="bl" data-i="1" style="background:radial-gradient(circle at 30% 30%,#a0e7ff,#1d7bff)">?</div>
    <div class="bl" data-i="2" style="background:radial-gradient(circle at 30% 30%,#fff3a0,#ffb703)">?</div>
  </div>
</section>

<!-- 4. DANCE -->
<section class="scr" id="s4">
  <div class="dancer"><div class="hat"></div><div class="head">😄</div><div class="body"></div><div class="arm al"></div><div class="arm ar"></div><div class="leg ll"></div><div class="leg lr"></div></div>
  <div class="tag" id="dn"></div>
</section>

<!-- GIFT -->
<section class="scr" id="s7">
  <div class="sub">✦ A surprise for you ✦</div>
  <h1 id="gt">Tap the gift!</h1>
  <div class="gift" id="gift">🎁</div>
  <div class="reveal" id="rv">
    <div class="coupon">🎟️ Special Birthday Coupon<b id="cp"></b>Valid for: Unlimited Happiness, Success &amp; Cake 🎂</div>
    <button class="b" id="gnext">Continue 💌</button>
  </div>
</section>

<!-- SPECIAL MESSAGE -->
<section class="scr" id="s8">
  <div class="ring"><div id="pf"></div></div>
  <div class="lines" id="ln"></div>
  <button class="b" id="mnext" style="display:none">Continue 🎂</button>
</section>

<!-- 5. CAKE -->
<section class="scr" id="s5">
  <div class="hint" id="hint"></div>
  <div class="cakewrap" id="cw">
    <div class="candles" id="cds"></div>
    <div class="cakehalf l"><div class="cake"><div class="t3"></div><div class="t2"></div><div class="t1"></div></div></div>
    <div class="cakehalf r"><div class="cake"><div class="t3"></div><div class="t2"></div><div class="t1"></div></div></div>
  </div>
</section>

<!-- 6. FINALE -->
<section class="scr" id="s6">
  <h1 id="fin"></h1>
  <div class="dancer"><div class="hat"></div><div class="head">🥳</div><div class="body"></div><div class="arm al"></div><div class="arm ar"></div><div class="leg ll"></div><div class="leg lr"></div></div>
  <div class="cert" id="cert"></div>
  <div class="tag" style="font-size:19px">Have a wonderful year ahead! 🎂🎈</div>
</section>

<div class="msg" id="msg"><h2 id="mt"></h2><br><button class="b" id="mok">Continue</button></div>

/* Optional: your own song file, e.g. "song.mp3". Leave "" to use built-in Happy Birthday tune */
const SONG_FILE = "";

let PH=PHOTOS.slice();PHOTOS.forEach((u,i)=>{try{fetch(u).then(r=>r.blob()).then(b=>{PH[i]=URL.createObjectURL(b)}).catch(()=>{})}catch(e){}});
const $=s=>document.querySelector(s);
let NAME="",AGE=0,muted=false,AC;
function show(id){document.querySelectorAll('.scr').forEach(e=>e.classList.remove('on'));$(id).classList.add('on')}

/* background balloons */
const cols=['#ff4d6d','#4cc9f0','#ffd166','#80ed99','#c77dff','#ff9a44'];
for(let i=0;i<7;i++){const b=document.createElement('div');b.className='fb';b.style.cssText=`left:${Math.random()*100}%;background:${cols[i%6]};animation-duration:${8+Math.random()*8}s;animation-delay:${-Math.random()*12}s;scale:${.6+Math.random()*.8}`;$('#bg').appendChild(b)}

for(let i=0;i<24;i++){const t=document.createElement('div');t.className='st';t.style.cssText=`left:${Math.random()*100}%;top:${Math.random()*100}%;animation-delay:${-Math.random()*3}s;scale:${.5+Math.random()*1.2}`;document.body.appendChild(t)}
let lastSp=0;addEventListener('pointermove',e=>{const n=Date.now();if(n-lastSp<140)return;lastSp=n;const d=document.createElement('div');d.className='sp';d.textContent=['✦','✧','★'][Math.random()*3|0];d.style.left=e.clientX+'px';d.style.top=e.clientY+'px';document.body.appendChild(d);setTimeout(()=>d.remove(),800)});
/* ====== AUDIO ====== */
const N={C:261.6,D:293.7,E:329.6,F:349.2,G:392,A:440,B:493.9,C2:523.3,D2:587.3,E2:659.3,F2:698.5,G2:784};
const SONG=[['G',.75],['G',.25],['A',1],['G',1],['C2',1],['B',2],['G',.75],['G',.25],['A',1],['G',1],['D2',1],['C2',2],['G',.75],['G',.25],['G2',1],['E2',1],['C2',1],['B',1],['A',2],['F2',.75],['F2',.25],['E2',1],['C2',1],['D2',1],['C2',2]];
let melTimer,fileAudio,melGen=0;
function ctx(){if(!AC)AC=new(window.AudioContext||window.webkitAudioContext)();if(AC.state==='suspended')AC.resume();return AC}
function note(f,t,d,type='triangle',v=.18){const a=ctx(),o=a.createOscillator(),g=a.createGain();o.type=type;o.frequency.value=f;g.gain.setValueAtTime(0,t);g.gain.linearRampToValueAtTime(v,t+.03);g.gain.exponentialRampToValueAtTime(.001,t+d);o.connect(g).connect(a.destination);o.start(t);o.stop(t+d+.05)}
function stopMusic(){melGen++;clearTimeout(melTimer);if(fileAudio){fileAudio.pause()}}
function playSong(loop,tempo,done){
  stopMusic();const my=melGen;
  if(muted)return done&&setTimeout(done,SONG.reduce((s,n)=>s+n[1],0)*tempo*1000);
  if(SONG_FILE){fileAudio=fileAudio||new Audio(SONG_FILE);fileAudio.loop=loop;fileAudio.currentTime=0;fileAudio.play().catch(()=>{});if(done)fileAudio.onended=done;return}
  const a=ctx();let t=a.currentTime+.1;
  SONG.forEach(([n,b],i)=>{const d=b*tempo;note(N[n],t,d*.95);note(N[n]/2,t,d*.95,'sine',.1);t+=d});
  const total=(t-a.currentTime)*1000;
  melTimer=setTimeout(()=>{if(my!==melGen)return;if(loop)playSong(true,tempo,done);else done&&done()},total);
}
function popSound(){if(muted)return;const a=ctx(),len=a.sampleRate*.25,buf=a.createBuffer(1,len,a.sampleRate),d=buf.getChannelData(0);
  for(let i=0;i<len;i++)d[i]=(Math.random()*2-1)*Math.pow(1-i/len,3);
  const s=a.createBufferSource(),g=a.createGain();g.gain.value=.9;s.buffer=buf;s.connect(g).connect(a.destination);s.start()}
$('#vol').onclick=()=>{muted=!muted;$('#vol').textContent=muted?'🔇':'🔊';if(muted)stopMusic()}

/* ====== CONFETTI ====== */
const cv=$('#conf'),cx=cv.getContext('2d');let parts=[];
function size(){cv.width=innerWidth;cv.height=innerHeight}size();addEventListener('resize',size);
function burst(n=120,x=cv.width/2,y=cv.height/3){n=Math.round(n*.55);if(parts.length>350)return;kick();for(let i=0;i<n;i++)parts.push({x,y,vx:(Math.random()-.5)*14,vy:Math.random()*-12-2,c:cols[i%6],s:5+Math.random()*6,r:Math.random()*6,l:160})}
let run=false;
function loop(){cx.clearRect(0,0,cv.width,cv.height);parts=parts.filter(p=>p.l>0);parts.forEach(p=>{p.x+=p.vx;p.y+=p.vy;p.vy+=.28;p.r+=.2;p.l--;cx.save();cx.translate(p.x,p.y);cx.rotate(p.r);cx.fillStyle=p.c;cx.fillRect(-p.s/2,-p.s/2,p.s,p.s*.6);cx.restore()});if(parts.length)requestAnimationFrame(loop);else run=false}
function kick(){if(!run){run=true;requestAnimationFrame(loop)}}

function fw(x,y){if(parts.length>350)return;kick();const c=cols[Math.random()*6|0],n=24;for(let i=0;i<n;i++){const a=i/n*Math.PI*2,v=3+Math.random()*3;parts.push({x,y,vx:Math.cos(a)*v,vy:Math.sin(a)*v,c,s:4,r:0,l:90})}}
/* ====== 1 → 2 : FORM & AGE ====== */
$('#save').onclick=()=>{
  if(!$('#nm').value.trim()||!$('#dob').value){alert('Please enter your name and date of birth');return}
  NAME=$('#nm').value.trim().replace(/\b\w/g,c=>c.toUpperCase());
  const dp=$('#dob').value.split('-'),dob=new Date(+dp[0],+dp[1]-1,+dp[2]),now=new Date();
  let y=now.getFullYear()-dob.getFullYear(),m=now.getMonth()-dob.getMonth(),d=now.getDate()-dob.getDate();
  if(d<0){m--;d+=new Date(now.getFullYear(),now.getMonth(),0).getDate()}
  if(m<0){y--;m+=12}
  if(y<0){alert('Please enter a valid date of birth');return}
  AGE=y;try{ctx()}catch(e){}$('#vol').style.display='block';
  $('#greet').textContent=`Happy Birthday ${NAME}! 🎉`;
  show('#s2');burst(150);playSong(false,.42);
  const el=$('#age');el.innerHTML='';
  const lines=[`Calculating your journey...`,`You have beautifully completed <b id="cy">0</b> years`,`${m} months and ${d} days of a wonderful life ✨`];
  lines.forEach((t,i)=>setTimeout(()=>{el.innerHTML+=`<div style="animation:fade .8s">${t}</div>`;if(i===1){let c=0;const iv=setInterval(()=>{c++;$('#cy').textContent=c;if(c>=y)clearInterval(iv)},Math.max(30,1200/Math.max(y,1)))}},i*1400));
  setTimeout(()=>{$('#go').style.display='inline-block';burst(100)},4600);
};

/* ====== 2 → 3 : CELEBRATION ====== */
$('#go').onclick=()=>{show('#s3');playSong(true,.4);
  const list=PHOTOS.length?PH:['🎁','🎈','🎂','🥳','🎉','🎊'];
  let k=0;
  const spawn=()=>{if(!$('#s3').classList.contains('on')&&!$('#s4').classList.contains('on'))return;
    const p=document.createElement('div');p.className='ph';const it=list[k++%list.length];
    p.innerHTML=PHOTOS.length?`<img src="${it}" alt="">`:`<div>${it}</div>`;
    p.style.cssText+=`left:${5+Math.random()*75}%;top:105vh;--r:${(Math.random()*24-12)}deg;animation-duration:${9+Math.random()*4}s`;
    document.body.appendChild(p);setTimeout(()=>p.remove(),14000)};
  spawn();window.phTimer=setInterval(()=>{spawn();if(!$('#s3').classList.contains('on')&&!$('#s4').classList.contains('on')&&!$('#s5').classList.contains('on')){}},2600);
};

let popped=0;
document.querySelectorAll('.bl').forEach(b=>b.onclick=()=>{
  if(b.classList.contains('pop'))return;b.classList.add('pop');popSound();popped++;
  const r=b.getBoundingClientRect();burst(50,r.left+40,r.top+50);
  const i=+b.dataset.i;
  setTimeout(()=>{
    if(i===0)openMsg(`Happy Birthday<br>${NAME}! 🎉`,()=>next(i));
    if(i===1)openMsg(`You are now<br>${AGE} years old! 🎂`,()=>next(i));
    if(i===2){closeMsg();startDance()}
  },350);
});
function next(){}
function openMsg(t,cb){$('#mt').innerHTML=t;$('#msg').classList.add('on');$('#mok').onclick=()=>{closeMsg();cb&&cb()}}
function closeMsg(){$('#msg').classList.remove('on')}
function startDance(){
  show('#s4');$('#dn').textContent=`${NAME} is dancing! 💃🕺`;burst(120);
  setTimeout(startGift,9000);
}

/* ====== GIFT ====== */
function startGift(){
  clearInterval(window.phTimer);document.querySelectorAll('.ph').forEach(p=>p.remove());
  show('#s7');$('#cp').textContent=NAME+' – Lifetime Pass';
  $('#gift').onclick=()=>{popSound();burst(160,innerWidth/2,innerHeight/3);$('#gift').style.display='none';$('#gt').textContent='🎉 Surprise! 🎉';$('#rv').style.display='block'};
  $('#gnext').onclick=startMsg;
}
/* ====== SPECIAL MESSAGE ====== */
function startMsg(){
  show('#s8');const ln=$('#ln');ln.innerHTML='';$('#mnext').style.display='none';
  const pf=$('#pf'),ph=PHOTOS.length?PH:[];let pi=0;
  const setP=()=>{if(ph.length)pf.style.backgroundImage=`url(${ph[pi++%ph.length]})`;else pf.textContent='🎂'};setP();
  const pv=setInterval(()=>{if(!$('#s8').classList.contains('on'))return clearInterval(pv);setP()},2200);
  const L=[`Dear ${NAME},`,'May your life shine as bright as your smile ✨','Thank you for being such a wonderful person 💛','May every dream you chase come true this year 🌟','You truly are special, and today is all yours 👑'];
  L.forEach((t,i)=>setTimeout(()=>{ln.innerHTML+=`<div>${t}</div>`;burst(25,innerWidth/2,innerHeight/2)},i*2000));
  setTimeout(()=>$('#mnext').style.display='inline-block',L.length*2000);
  $('#mnext').onclick=startCake;
}
/* ====== CAKE ====== */
function startCake(){
  clearInterval(window.phTimer);document.querySelectorAll('.ph').forEach(p=>p.remove());
  show('#s5');const cd=$('#cds');cd.innerHTML='<div class="cd"><div class="fl"></div></div>'.repeat(5);
  $('#hint').innerHTML='🎶 Happy Birthday to you... 🎶';
  playSong(false,.45,()=>{
    $('#hint').innerHTML='Make a wish & blow out the candles! 🕯️💨';
    setTimeout(windShow,2200);
  });
}
function windShow(){
  for(let i=0;i<9;i++){const w=document.createElement('div');w.className='wind';w.style.top=(25+i*5)+'%';w.style.animationDelay=(i*.08)+'s';document.body.appendChild(w);setTimeout(()=>w.remove(),2200)}
  document.querySelectorAll('.cd').forEach((c,i)=>setTimeout(()=>c.classList.add('off'),500+i*120));
  setTimeout(()=>{$('#hint').innerHTML='Now cut the cake with the knife 🔪<br><small>Drag the knife across the cake</small>';makeKnife()},2200);
}
function makeKnife(){
  const k=document.createElement('div');k.className='knife';k.textContent='🔪';
  k.style.left='12%';k.style.top='62%';document.body.appendChild(k);
  let drag=false,prog=0,done=false;
  k.onpointerdown=e=>{drag=true;k.setPointerCapture(e.pointerId);k.style.animation='none'};
  k.onpointermove=e=>{if(!drag||done)return;k.style.left=(e.clientX-32)+'px';k.style.top=(e.clientY-32)+'px';
    const r=$('#cw').getBoundingClientRect();
    if(e.clientX>r.left&&e.clientX<r.right&&e.clientY>r.top&&e.clientY<r.bottom){prog++;
      if(prog>14){done=true;k.remove();cutCake()}}};
  k.onpointerup=()=>drag=false;
}
function cutCake(){
  popSound();$('#cw').classList.add('cut');burst(120,innerWidth/2,innerHeight/2);
  $('#hint').innerHTML='🎂 Yummy! Cake cut successfully! 🎂';
  setTimeout(finale,2800);
}

/* ====== FINALE ====== */
function finale(){
  show('#s6');$('#fin').innerHTML=`Happy Birthday<br>${NAME}! 🎉`;
  playSong(true,.28);burst(200);
  $('#cert').innerHTML=`🏆 <b>Certificate of Awesomeness</b><br>Proudly presented to <b>${NAME}</b><br>for being ${AGE} years of pure amazing!`;
  setInterval(()=>fw(Math.random()*innerWidth,60+Math.random()*innerHeight/2),900);
}
</script>
</body>
</html>
